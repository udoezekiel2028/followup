services:
  - type: web
    name: smartfollow-ai
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 8000
      - key: TOKEN_ENCRYPTION_KEY
        value: iSGiQfD4uBqFVl84GavwOTMDebcDw5ki8KgNnI-sUZU=
      - key: SECRET_KEY
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: smartfollow-postgres
          property: connectionString

databases:
  - name: smartfollow-postgres
    plan: free
